services:
  db:
    image: postgres:16-alpine
    container_name: sp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      # مربوط بالواجهة المحليّة فقط: قاعدة البيانات لا يصل إليها إلا الخادم
      # نفسه. كان النشر على كل الواجهات (0.0.0.0) يجعلها مكشوفةً لحظة تغيير
      # مجموعة الأمان أو نقل الخادم إلى شبكةٍ أخرى — واعتمادُ الحماية على طبقةٍ
      # واحدة خارج المشروع مخاطرةٌ لا داعي لها. والواجهة الخلفية تصل عبر شبكة
      # Docker الداخلية لا عبر هذا المنفذ، فلا شيء ينكسر.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sp_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      # وسم النسخة في صميم البنية التحتية (لا في .env كي لا يختلف مستقبلاً):
      # الأساسية A، وسكربت النسخة الثانية يقلبه إلى B ضمن إعادة تسميته الجوهرية.
      # يُحقن كمتغيّر بيئة حقيقي فيتقدّم على أي قيمة في .env عند قراءته.
      - SP_COPY=A
    env_file:
      - .env
    volumes:
      - ./backend:/app
      # ══ أدواتُ اللجنة داخل الحاوية ══
      # `scripts/` في جذر المستودع خارج ربط `./backend:/app`، فكان
      # `/app/scripts/audit/market_sweep.py` غيرَ موجودٍ داخل الحاوية
      # والملفُّ على الخادم. ويُربط للقراءة فقط: أداةُ فحصٍ لا تكتب شيئاً.
      - ./scripts:/app/scripts:ro
      - ./config:/app/config
      - ./data:/app/data
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./backups:/app/backups
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost/api
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: sp_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro

volumes:
  postgres_data:
