<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- خلفية داكنة من أول رسمة (قبل تحميل حزمة التنسيقات) — تمنع وميض البياض
       الذي كان يفرض نفسه خلف الشعار عند فتح/إغلاق تطبيق PWA على iOS. -->
  <style>html,body,#root{margin:0;background:#060b18;min-height:100%}</style>
  <meta name="description" content="Smart Portfolio — AI-Powered Personal Investment Management" />
  <title>Smart Portfolio | المحفظة الذكية</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%239b34e6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7.4' fill='url(%23g)'/%3E%3Crect x='5.5' y='18.6' width='4.75' height='9.8' rx='1.6' fill='%238e8e93'/%3E%3Crect x='13.6' y='13.2' width='4.75' height='15.2' rx='1.6' fill='%23d1d1d6'/%3E%3Crect x='21.7' y='7.4' width='4.75' height='21' rx='1.6' fill='white'/%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest?v=5" />
  <!-- ?v=3: كسر كاش iOS للأيقونة — سفاري يحتفظ بالأيقونة القديمة (بأطرافها
       البيضاء) حتى بعد إعادة الإضافة؛ تغيير المسار يُجبره على جلب النظيفة. -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- `black-translucent` يجعل نصّ شريط حالة iOS أبيض فوق أرضيةٍ بيضاء
         فيختفي الوقت والبطارية. `default` يكتبه أسود على خلفية التطبيق. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="المحفظة الذكية" />
  <!-- لون شريط النظام يتبع مظهر الجهاز: قيمةٌ واحدة داكنة كانت تُطبَّق على
         تطبيقٍ أرضيّته بيضاء. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0c0a" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
