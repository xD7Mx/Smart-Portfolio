server {
    listen 80;
    server_name _;

    # يتّسع لحدّ رفع الكتاب (LIBRARY_MAX_FILE_MB=60) مع هامش.
    client_max_body_size 80M;
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    # ── رؤوس الأمان ──────────────────────────────────────────────────
    # تطبيقٌ ماليّ بلا رؤوس أمان يترك أبواباً مفتوحة بلا مقابل. لا يمسّ
    # أيٌّ منها البيانات ولا السلوك، وكلّها معياريّة:
    #   • تأطيره داخل موقعٍ آخر (clickjacking) — يُمنع.
    #   • تخمين المتصفّح لنوع الملف (MIME sniffing) — يُمنع.
    #   • تسريب العنوان الكامل لمواقعَ خارجية عند فتح خبر — يُقصَر على الأصل.
    #   • الكاميرا والميكروفون والموقع — لا يحتاجها التطبيق، فتُغلق.
    # ملاحظة: HSTS مُعلَّق حتى تُفعَّل HTTPS؛ إرساله على http بلا شهادة
    # يقفل الوصول على المالك نفسه. يُفعَّل بإزالة التعليق بعد الشهادة.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # استعادة النسخة الاحتياطية: الملف يُضمّن كامل ملفات المكتبة (PDF/غلاف/نصّ)
    # مُرمَّزة base64 — قد يبلغ حجمه مئات الميجابايت (حتى ~1.6ج عند سقف المكتبة)،
    # فيتجاوز حدّ الرفع العام 80M ويُرفَض بـ413. نرفع الحدّ ونطيل المهلة لهذا
    # المسار وحده. (أطول بادئة تفوز في مطابقة nginx، فيسبق /api/ العام.)
    location /api/v1/backups/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 2048M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
    }

    # API - route to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # index.html must never be cached — it's the only unhashed entry point,
    # and it references the hashed JS/CSS filenames from the LAST build. If
    # the browser (or this proxy) caches it, a rebuild that changes those
    # hashes silently has no visible effect until the stale HTML expires,
    # even though the new bundle is sitting right there on disk.
    location = / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static files caching — safe to cache hard since Vite content-hashes
    # every filename (a rebuild always produces a new URL, never reuses one).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        proxy_pass http://frontend:3000;
        expires 7d;
        add_header Cache-Control "public";
    }
}
