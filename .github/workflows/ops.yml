# ─────────────────────────────────────────────────────────────────────────
# تشغيلُ عملياتِ الخادم من المستودع — للمالك حين يكون بعيداً.
#
# لا يعمل هذا الملفُّ إلا على **عاملٍ مستضافٍ على خادم المالك**
# (‏self-hosted runner)، فلا يصل أحدٌ إلى بياناته من خارجه. وما يُشغَّل
# هو ما في هذا الملفّ وحدَه — يُراجَع في المستودع قبل أيّ تشغيل.
#
# ولا يبني حزمةً ولا يسلّم: البناءُ بإذنٍ صريحٍ من المالك وحدَه (بند
# الميثاق الثالث)، واسمُها `spupdatechanged.tar.gz` بـ`scripts/package.sh`.
# ─────────────────────────────────────────────────────────────────────────
name: عملياتُ الخادم

on:
  workflow_dispatch:
    inputs:
      # ══ أسماءُ المُدخَلات لاتينيةٌ حتماً ══ (D407-ب)
      # لغةُ تعابير GitHub (`inputs.x`) لا تقبل محرفاً غيرَ لاتينيّ،
      # فاسمٌ عربيٌّ يُبطل الملفَّ كلَّه عند التشغيل لا عند الدفع.
      # فالأسماءُ لاتينيةٌ والوصفُ عربيٌّ — وهو ما يراه المالك.
      task:
        description: "ما الذي يُشغَّل على الخادم"
        required: true
        default: chain
        type: choice
        options:
          - chain        # سلسلةُ المعلومة حلقةً حلقةً — قراءةٌ فقط
          - audit        # لجنةُ كشف الأعطال — قراءةٌ فقط
          - sample       # عيّنةُ كلّ قطاعٍ تُحاكم المحرّكَين
          - sweep        # مسحةُ التقييم: درجةٌ وسعرٌ عادلٌ للـ273
          - complete     # الدورةُ كاملةً بالترتيب
          - probe        # كاشفٌ واحدٌ باسمه من scripts/audit — قراءةٌ فقط
          - candidate_ab # ‏D696: الأساسُ (مرجعُه في probe_name) ثمّ المرشَّح في الجولة نفسِها — قراءةٌ فقط
          - history_ab   # ‏D706: الاختبارُ التاريخيّ الطويل (منذ 2019) للأساس والمرشَّح — قراءةٌ فقط
          - web          # بناءُ الواجهة ونشرُها — داخلَ دوكر لا على المضيف
          - health       # حالُ الخادم: الحاوياتُ والموارد والردود — ويُشغَّل ما توقّف منها
          - memory       # خريطةُ الذاكرة: من يشغلها، وما يمكن تحريرُه — قراءةٌ فقط
      probe_name:
        description: >-
          اسمُ ملفِّ الكاشف حين تكون المهمّةُ probe — من `scripts/audit`
          وحدَها، بلا مسارٍ ولا معاملات. مثال: filing_types_door.py
        required: false
        default: ""
      container:
        description: "اسمُ حاوية الخادم"
        required: false
        default: sp_backend

concurrency:
  group: sp-ops
  cancel-in-progress: false

jobs:
  # ══ ‏D716: الواجهةُ تُبنى على أجهزة GitHub لا على الخادم ══
  # الخادمُ ‎909‎ م.ب ومعالجُه قابلٌ للاستنزاف: بناءٌ استغرق ثلاثَ دقائق ظهراً امتدّ سبعَ عشرةَ دقيقةً مساءً بعد يومٍ من العمل.
  # فيُبنى هنا ويُرفع ملفّاً جاهزاً، ولا يفعل الخادمُ إلا أن يضعه مكانَ القديم — بلا بناءٍ ولا حِمل.
  build_web:
    if: inputs.task == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: البناء
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          VITE_API_URL=/api/v1 npm run build
          tar czf "$RUNNER_TEMP/web-build.tgz" build
          ls -la "$RUNNER_TEMP/web-build.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ runner.temp }}/web-build.tgz
          retention-days: 3

  run:
    needs: [build_web]
    if: ${{ always() && (needs.build_web.result == 'success' || needs.build_web.result == 'skipped') }}
    runs-on: [self-hosted, smart-portfolio]
    timeout-minutes: 60
    steps:
      - name: الواجهةُ المبنيّة
        if: inputs.task == 'web'
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ${{ runner.temp }}/web
      - name: تسويةُ الشجرة على الفرع
        run: |
          cd ~/Smart-Portfolio
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout FETCH_HEAD -- .
          # ‏D715: والتسويةُ تامّة — يُثبَّت المستودعُ على إيداع الفرع، ويُزال ما يقول تاريخُ الفرع إنه حُذف (وحده)
          git -c advice.detachedHead=false checkout -q -f --detach FETCH_HEAD 2>/dev/null || true
          git ls-files --others --exclude-standard -- frontend/src backend/app scripts 2>/dev/null | while read -r f; do
            if git log FETCH_HEAD -1 --format=%h --diff-filter=D -- "$f" 2>/dev/null | grep -q .; then
              echo "  يُزال ملفٌّ حُذف من الفرع: $f"; rm -f -- "$f"
            fi
          done
          echo "الشجرةُ عند $(git rev-parse --short FETCH_HEAD)"

      - name: التنفيذ
        env:
          C: ${{ inputs.container }}
          T: ${{ inputs.task }}
          P: ${{ inputs.probe_name }}
        run: |
          cd ~/Smart-Portfolio
          set -u
          case "$T" in
            chain)
              docker exec "$C" python /app/scripts/audit/chain_integrity.py ;;
            audit)
              # ‏D714: في صورة الخادم نفسِها (تبعيّاتُ بايثون حاضرة) والمستودعُ للقراءة فقط
              bash scripts/ops/committee_image.sh ;;
            sample)
              docker exec "$C" python \
                /app/scripts/audit/sector_quality_sample.py --n 2 ;;
            sweep)
              # أسطرُ بايثون تبقى **داخلَ** إزاحة كتلة YAML: كانت تبدأ من
              # العمود صفر فتُنهي الكتلةَ، فلا يُحلَّل الملفُّ ولا يعمل
              # سيرُ العمل أصلاً — عطبٌ صامتٌ لا يظهر إلا عند أوّل تشغيل.
              docker exec "$C" python -c "$(printf '%s\n' \
                "import asyncio, sys; sys.path.insert(0,'/app')" \
                "from app.services.market_valuation_sweep import sweep" \
                "print(asyncio.run(sweep()))")" ;;
            complete)
              bash scripts/ops/complete.sh ;;
            memory)
              # ══ خريطةُ الذاكرة (سؤالُ المالك: «ألا يمكن توسيعُ الذاكرة بتنظيفها؟») — قراءةٌ فقط، أسماءُ عمليّاتٍ وأرقام ══
              free -m; echo; grep -E "^(MemTotal|MemAvailable|Cached|SwapCached|Shmem|Slab|SReclaimable|AnonPages|Committed_AS)" /proc/meminfo
              echo "— swappiness: $(cat /proc/sys/vm/swappiness) · zram: $(ls /sys/block | grep -c zram)"
              echo "— أثقلُ العمليّات (الذاكرةُ المقيمة ‎MB‎ · المبادلة ‎MB‎ · الأمر):"
              for d in /proc/[0-9]*; do
                r=$(awk '/^VmRSS/{print int($2/1024)}' $d/status 2>/dev/null); w=$(awk '/^VmSwap/{print int($2/1024)}' $d/status 2>/dev/null)
                [ -n "$r" ] && [ "$r" -ge 8 ] && printf '%5s %5s  %s\n' "$r" "${w:-0}" "$(tr '\0' ' ' < $d/cmdline 2>/dev/null | cut -c1-90)"
              done | sort -rn | head -25
              echo "— الحاويات:"; docker stats --no-stream --format '{{.Name}}\t{{.MemUsage}}' || true
              echo "— الخدماتُ العاملة:"; systemctl list-units --type=service --state=running --no-legend 2>/dev/null | awk '{print $1}' | tr '\n' ' '; echo
              echo "— sudo بلا كلمة مرور: $(sudo -n true 2>/dev/null && echo نعم || echo لا)"
              echo "— القرص:"; df -h / | tail -1; docker system df 2>/dev/null || true ;;
            health)
              # ══ حالُ الخادم (بلاغُ المالك 2026-10-14: «التطبيق واقف») ══ — أرقامٌ لا سجلّات: سجلُّ الحاوية قد يحمل
              # قيمَ إعدادات (‏D714)، فلا يُطبع. وما توقّف من الحاويات الأربع يُشغَّل بإعداده نفسِه.
              uptime; free -m | head -3; df -h / | tail -1
              echo "— نفادُ الذاكرة في الإقلاع السابق والحاليّ (أسماءُ العمليّات وحدها):"
              for b in -1 0; do
                (journalctl -k -b "$b" --no-pager 2>/dev/null || sudo -n journalctl -k -b "$b" --no-pager 2>/dev/null) \
                  | grep -iE "out of memory|oom-kill|Killed process" | sed -E 's/.*(Killed process [0-9]+ \([^)]*\)|Out of memory[^,]*|oom-kill[^,]*).*/  [\1]/' | tail -6
              done
              last -x reboot 2>/dev/null | head -3
              docker ps -a --format '{{.Names}}\t{{.Status}}' | grep -E '^sp_' || true
              for s in postgres backend frontend nginx; do
                [ "$(docker inspect -f '{{.State.Running}}' "sp_$s" 2>/dev/null)" = true ] || {
                  echo "↻ sp_$s متوقّفة — تُشغَّل"; docker compose up -d --no-deps "$s" 2>&1 | tail -2; }
              done
              docker stats --no-stream --format '{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' || true
              echo "— كلُّ الحاويات:"; docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}' | cut -c1-120
              echo "— أثقلُ العمليّات على المضيف (الاسمُ وحده):"; ps -eo pid,rss,pcpu,etime,comm --sort=-rss | head -14
              echo "— العمليّاتُ داخل الخادم:"; docker top "$C" -o pid,etime,pcpu,rss,args 2>/dev/null | cut -c1-150 | head -20
              # مراحلُ الإقلاع وحدها، بأسطرٍ يكتبها التطبيقُ نفسُه — وكلُّ ما يشبه سرّاً يُقنَّع (رمزُ البوت · ‎user:pass@‎ · ‎key=‎)
              echo "— مراحلُ الإقلاع (آخر ١٥ دقيقة):"
              docker logs --since 15m "$C" 2>&1 | grep -E "🚀|🕒|🧹|إقلاع|startup|Uvicorn|Waiting|قاعدةُ البيانات|استرداد|صقر|الجدولة|❌|Traceback|Error" \
                | sed -E 's#bot[0-9]+:[A-Za-z0-9_-]+#bot***#g; s#://[^/@ ]+@#://***@#g; s#((key|token|password|secret|pass)[A-Za-z_]*[=:] *)[^ &,]+#\1***#Ig' \
                | cut -c1-170 | tail -25
              for u in http://localhost/ http://localhost/api/v1/health http://localhost:3000/; do
                curl -sk -o /dev/null -m 20 -w "  $u → %{http_code} في %{time_total}s\n" "$u" || echo "  $u → لا ردّ"
              done ;;
            web)
              # ══ ‏D716: الواجهةُ مبنيّةٌ على أجهزة GitHub (‏build_web) — والخادمُ يضعها مكانَ القديمة فقط ══
              # تُنسخ إلى ‎build.new‎ ثمّ تُبدَّل بالاسم في لحظة (‏serve يقرأ المجلّدَ باسمه)، وتُحفظ في صورة الحاوية فلا تعود
              # القديمةُ إن أُعيد إنشاؤها. ولا بناءَ للواجهة على الخادم بعد اليوم.
              T="$RUNNER_TEMP/web/web-build.tgz"
              [ -s "$T" ] || { echo "✘ لا واجهةَ مبنيّة"; exit 1; }
              rm -rf /tmp/sp-web && mkdir -p /tmp/sp-web && tar xzf "$T" -C /tmp/sp-web
              [ -f /tmp/sp-web/build/index.html ] || { echo "✘ البناءُ بلا index.html"; exit 1; }
              docker exec sp_frontend rm -rf /app/build.new /app/build.old
              docker cp /tmp/sp-web/build sp_frontend:/app/build.new
              docker exec sp_frontend sh -c 'mv /app/build /app/build.old && mv /app/build.new /app/build && rm -rf /app/build.old'
              IMG="$(docker inspect -f '{{.Config.Image}}' sp_frontend)"
              docker commit sp_frontend "$IMG" >/dev/null && echo "حُفظت في الصورة ${IMG}"
              rm -rf /tmp/sp-web
              # ‏D715: بصمةُ الواجهة المنشورة
              git rev-parse FETCH_HEAD:frontend > .web_built_tree 2>/dev/null || true
              curl -s -o /dev/null -w "الواجهة → %{http_code}\n" -m 20 http://localhost/
              echo "الواجهةُ نُشرت (مبنيّةً على GitHub)" ;;
            history_ab)
              bash scripts/ops/mem_gate.sh 350 "قياس المرشَّح" || exit 1   # ‏D716: لا قياسَ ثقيلٌ والخادمُ مضغوط
              # ══ ‏D706 (بأمر المالك: «التاريخُ جوهرُ توقّعات المستقبل»): الاختبارُ نفسُه على تاريخٍ أطول ══
              # الأساسُ المجمَّد (طريقةُ متوسّط النماذج) ثمّ المرشَّح، من 2019 وعلى آفاق 90 و180 و365 يوماً — قراءةٌ فقط.
              case "$P" in
                ""|*[!0-9a-f]*) echo "مرجعُ الأساس غيرُ مقبول: [$P] — بصمةُ إيداعٍ سداسيّةٌ عشرية"; exit 2 ;;
              esac
              rm -rf /tmp/sp-control && mkdir -p /tmp/sp-control
              git archive "$P" backend/app | tar -x -C /tmp/sp-control
              docker exec "$C" rm -rf /tmp/control
              docker cp /tmp/sp-control/backend "$C":/tmp/control
              docker exec "$C" sh -c 'for e in /app/*; do n=$(basename "$e"); [ "$n" = app ] || ln -sfn "$e" "/tmp/control/$n"; done'
              echo "════════ التاريخ: الأساسُ $P ════════"
              docker exec -e SP_CODE_ROOT=/tmp/control -e SP_BT_FIRST=2019-03 "$C" python /app/scripts/audit/fv_backtest_d699.py
              echo "════════ التاريخ: المرشَّح ════════"
              docker exec -e SP_BT_FIRST=2019-03 "$C" python /app/scripts/audit/fv_backtest_d699.py
              docker exec "$C" rm -rf /tmp/control
              rm -rf /tmp/sp-control ;;
            candidate_ab)
              bash scripts/ops/mem_gate.sh 350 "قياس المرشَّح" || exit 1   # ‏D716: لا قياسَ ثقيلٌ والخادمُ مضغوط
              # ══ ‏D696: الأساسُ والمرشَّحُ في الجولة نفسِها ══
              # حارسُ التجميد يقارن المرشَّحَ بالأساس، والبياناتُ تتحرّك بين يومٍ ويوم بل بين حصادٍ وحصاد (‏D692 · D693:
              # حصادُ قوائمَ عند النشر غيّر انحرافَ التأمين بلا سطرِ شيفرة). فيُقاس الأساسُ المجمَّد — شيفرتُه من
              # `git archive` لمرجعه في `probe_name` — ثمّ المرشَّح، متتاليَين على المخازن نفسِها. لا يُكتب في أيّ مخزن،
              # والشاهدُ يُشغَّل من `/tmp/control` داخل الحاوية ثمّ يُحذف.
              case "$P" in
                ""|*[!0-9a-f]*) echo "مرجعُ الأساس غيرُ مقبول: [$P] — بصمةُ إيداعٍ سداسيّةٌ عشرية"; exit 2 ;;
              esac
              rm -rf /tmp/sp-control && mkdir -p /tmp/sp-control
              git archive "$P" backend/app | tar -x -C /tmp/sp-control
              docker exec "$C" rm -rf /tmp/control
              docker cp /tmp/sp-control/backend "$C":/tmp/control
              docker exec "$C" sh -c 'for e in /app/*; do n=$(basename "$e"); [ "$n" = app ] || ln -sfn "$e" "/tmp/control/$n"; done'
              echo "════════ الشاهد: الأساسُ $P ════════"
              docker exec -e SP_CODE_ROOT=/tmp/control "$C" python /app/scripts/audit/candidate_gate.py
              # ‏D700: والنتيجةُ — اختبارُ ما كان معلوماً منذ 2023 بشيفرة كلٍّ من الجانبين على البيانات نفسِها
              echo "════════ النتيجة: الأساسُ $P ════════"
              docker exec -e SP_CODE_ROOT=/tmp/control "$C" python /app/scripts/audit/fv_backtest_d699.py
              echo "════════ المرشَّح: الشجرةُ الحاليّة ════════"
              docker exec "$C" python /app/scripts/audit/candidate_gate.py
              echo "════════ النتيجة: المرشَّح ════════"
              docker exec "$C" python /app/scripts/audit/fv_backtest_d699.py
              docker exec "$C" rm -rf /tmp/control
              rm -rf /tmp/sp-control ;;
            probe)
              # اسمٌ مجرّدٌ من `scripts/audit` وحدَها: لا مسارَ ولا معاملاتٍ
              # ولا صَدَفة. فما يُشغَّل ملفٌّ مراجَعٌ في المستودع لا أمرٌ
              # يُمرَّر من خارجه.
              case "$P" in
                ""|*/*|*' '*|*';'*|*'&'*|*'|'*|*'$'*|*'`'*)
                  echo "اسمُ كاشفٍ غيرُ مقبول: [$P]"; exit 2 ;;
              esac
              [ -f "scripts/audit/$P" ] || {
                echo "لا كاشفَ بهذا الاسم: $P"; exit 2; }
              docker exec "$C" python "/app/scripts/audit/$P" ;;
            *) echo "مهمّةٌ غيرُ معروفة: $T"; exit 2 ;;
          esac
